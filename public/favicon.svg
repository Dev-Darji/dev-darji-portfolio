<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />
  
  <!-- Subtle Internal Grid Accent -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- DD Monogram -->
  <g filter="url(#glow)">
    <text x="64" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="900" font-size="46" letter-spacing="-1" text-anchor="middle" fill="url(#textGrad)">
      DD
    </text>
  </g>

  <!-- Active Pulse Dot -->
  <circle cx="102" cy="26" r="6" fill="#10b981" />
  <circle cx="102" cy="26" r="3" fill="#ffffff" />
</svg>
